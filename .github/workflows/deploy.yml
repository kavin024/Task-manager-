name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# pages/id-token are required by configure-pages + deploy-pages.
# actions: write is required to remove any stale "github-pages" artifact
# left behind by a previous attempt of the same run (see the cleanup step).
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Only ever let one Pages deployment run at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # npm ci / npm run build run inside frontend/.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Guarantee exactly one "github-pages" artifact per run. On a workflow
      # re-run, GitHub keeps the artifact from the previous attempt, so
      # deploy-pages would otherwise fail with:
      #   "Multiple artifacts named github-pages were unexpectedly found
      #    for this workflow run. Artifact count is 2."
      # Remove any stale copies before the single upload below.
      - name: Remove stale github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
            })
            const stale = data.artifacts.filter((a) => a.name === 'github-pages')
            for (const artifact of stale) {
              core.info(`Deleting stale artifact "${artifact.name}" (id ${artifact.id})`)
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              })
            }
            core.info(`Removed ${stale.length} stale github-pages artifact(s); exactly one will be uploaded next.`)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # The ONE and only Pages artifact upload. It packages the contents of
      # frontend/dist (not the repo root, source, or backend).
      - name: Upload React build
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
